[project]
name = "pushspeak"
version = "0.1.0"
description = "🎙️ Dictáfono minimalista para Linux con push-to-talk. Graba audio, transcribe con whisper.cpp e inserta texto automáticamente."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "hvarillas", email = "your.email@example.com" }
]
maintainers = [
    { name = "hvarillas", email = "your.email@example.com" }
]
keywords = [
    "dictation",
    "speech-to-text",
    "whisper",
    "voice-recognition",
    "push-to-talk",
    "transcription",
    "linux",
    "desktop-app"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
    "Environment :: X11 Applications :: Qt",
]

dependencies = [
    "pynput>=1.8.1",
    "pyperclip>=1.11.0",
    "numpy>=2.3.3",
    "sounddevice>=0.5.2",
    "pywebview>=6.0",
    "qtpy>=2.4.3",
    "pyqt6>=6.9.1",
    "pyqt6-webengine>=6.9.0",
    "psutil>=6.1.1",
]

[project.urls]
Homepage = "https://github.com/hvarillas/PushSpeak"
Repository = "https://github.com/hvarillas/PushSpeak.git"
Issues = "https://github.com/hvarillas/PushSpeak/issues"
Documentation = "https://github.com/hvarillas/PushSpeak#readme"

[project.scripts]
pushspeak = "main_desktop_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["app"]
